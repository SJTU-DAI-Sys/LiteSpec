mode: sft

launcher:
  target_model: Qwen/Qwen3-4B
  # Offline mode. Set this to your hidden-state cache; for online mode, disable it and enable train_data.
  # train_data: ./datasets/train.jsonl
  train_hidden_states: ./cache/data/regen_full_cache
  output_dir: ./outputs/dlite_sft_qwen3_4b
  nnodes: 1
  node_rank: 0
  nproc_per_node: 8
  master_addr: 127.0.0.1
  master_port: 29503

arguments:
  target_model_backend: sglang
  sglang_attention_backend: fa3
  sglang_mem_fraction_static: 0.4
  sglang_ep_size: 1
  attention_backend: flex_attention
  flex_attention_backend: TRITON
  chat_template: qwen
  local_position: true
  max_length: 4096
  batch_size: 1
  accumulation_steps: 4
  tp_size: 1
  shard_draft_by_tp: false
  dist_timeout: 1200
  block_size: 8
  num_draft_layers: 5
  chs_num_layers: 12
  # target_layer_ids overwrites the automatic layer selection.
  # target_layer_ids: 0,1,3,7,11,15,19,23,27,29,30,31
  sequential_head: rnn
  sequential_rank: 320
  num_anchors: 512
  num_epochs: 6
  learning_rate: 0.0004
  # AdamW-only weight decay; ignored when use_muon is true.
  weight_decay: 0.0
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  # Optional FSDP1 Muon + AdamW; these settings are ignored when disabled.
  use_muon: true
  muon_lr: 0.02
  muon_momentum: 0.95
  muon_weight_decay: 0.0
  # Each batch handles up to world_size * this many same-shape matrices.
  muon_matrices_per_rank: 1
  muon_adamw_lr: 0.0004
  muon_adamw_weight_decay: 0.0
  seed: 42
  final_ce_weight: 0.1
  l1_loss_weight: 1.0
  base_lm_ce_weight: 0.0
  loss_decay_gamma: 4
  base_lm_ce_decay_gamma: 12
  cache_dir: ./cache/train/dlite_sft
  build_dataset_num_proc: 128
  dataloader_num_workers: 8
  log_interval: 50
  save_interval: 20000
  report_to: wandb
  wandb_project: spec-decoding
  wandb_name: dlite_sft_qwen3_4b
  # D-T disaggregate settings
  # false: every rank runs target + draft; true: split target and draft ranks.
  disaggregate: false
  target_ranks_per_node: 4
  draft_ranks_per_node: 4
  target_tp_size: 1
  node_batch_size: 4
  draft_micro_batch_size: 1
  pipeline_depth: 2
  profile: false
